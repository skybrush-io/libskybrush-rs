name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings

jobs:
  check:
    name: Format, lints and docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Installs the toolchain of rust-toolchain.toml, with clippy, rustfmt
      # and the Cortex-M7 target
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets
      - run: cargo doc --no-deps

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      # The conformance cases and the traces of the C library, in tests/oracle
      - run: cargo test --all-targets
      - run: cargo test --doc

  firmware:
    name: Build for the flight controller
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      # Cortex-M7 with FPU, without std
      - run: cargo build --release --target thumbv7em-none-eabihf

  msrv:
    name: Minimum supported Rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install 1.98.1 --profile minimal --target thumbv7em-none-eabihf
      - uses: Swatinem/rust-cache@v2
      - run: cargo +1.98.1 test --all-targets
      - run: cargo +1.98.1 build --target thumbv7em-none-eabihf

  package:
    name: Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      # Builds the crate as it would be published
      - run: cargo package
