# Configuration of cargo-release (https://github.com/crate-ci/cargo-release).
#
#   cargo release              # dry run of releasing the version in Cargo.toml
#   cargo release minor        # dry run of a bump, e.g. 0.1.0 -> 0.2.0
#   cargo release ... --execute
#
# A release runs the tests, turns the Unreleased section of the changelog
# into the new version, commits, tags, publishes to crates.io and pushes.

allow-branch = ["main"]

# Tags like those of the C library: annotated, named after the version
tag-name = "{{version}}"
tag-message = "{{version}}"
pre-release-commit-message = "chore: release version {{version}}"

pre-release-hook = ["cargo", "test", "--all-targets"]

pre-release-replacements = [
  # The entries under Unreleased become those of the new version
  { file = "CHANGELOG.md", search = "## \\[Unreleased\\]", replace = "## [Unreleased]\n\n## [{{version}}] - {{date}}", exactly = 1 },
  # The link of the new version goes to its tag, and Unreleased compares
  # with it
  { file = "CHANGELOG.md", search = "\\[Unreleased\\]: .*", replace = "[Unreleased]: https://github.com/skybrush-io/libskybrush-rs/compare/{{tag_name}}...HEAD\n[{{version}}]: https://github.com/skybrush-io/libskybrush-rs/releases/tag/{{tag_name}}", exactly = 1 },
]
