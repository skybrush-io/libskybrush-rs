[package]
name = "skybrush"
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
description = "Parsing and playback of Skybrush drone show files"
license = "GPL-3.0-or-later"
authors = ["CollMot Robotics Ltd."]
publish = false

[dependencies]
libm = "0.2.16"

[lints.rust]
# Forbidden in the library by #![forbid(unsafe_code)] in src/lib.rs; tests may
# allow it where they need it (the counting allocator of tests/allocations.rs).
unsafe_code = "deny"
missing_docs = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Durations come in pairs that differ only in their units, as in the C
# library (duration_sec and duration_msec).
similar_names = "allow"
# A panic parks the flight controller module until reboot, stopping the show.
# Malformed input must be reported as an error instead.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"

[dev-dependencies]
serde_json = { version = "1.0.154", features = ["float_roundtrip"] }
